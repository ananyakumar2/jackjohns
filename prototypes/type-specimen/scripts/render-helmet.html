<!doctype html>
<!--
  Renders media/helmet.png from the helmet-follow model, transparent background.
  From the repository root, after `npm install` in prototypes/helmet-follow:
    python3 -m http.server 8090 --bind 127.0.0.1
    (any headless browser; the page sets window.__done once rendered, then save the canvas as PNG)
  then: ffmpeg -i media/helmet.png -vf scale=800:-1 -c:v libwebp -quality 86 media/helmet.webp (and delete the png)
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; background: transparent; }
      canvas { display: block; }
    </style>
    <script type="importmap">
      { "imports": {
        "three": "../../helmet-follow/node_modules/three/build/three.module.js",
        "three/addons/": "../../helmet-follow/node_modules/three/examples/jsm/"
      } }
    </script>
  </head>
  <body>
    <script type="module">
      import * as THREE from 'three';
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
      import { KTX2Loader } from 'three/addons/loaders/KTX2Loader.js';
      import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
      import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

      const S = 1200;
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(S, S);
      renderer.setClearColor(0x000000, 0);
      renderer.toneMapping = THREE.NeutralToneMapping;
      renderer.toneMappingExposure = 1.05;
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.03).texture;
      scene.environmentRotation = new THREE.Euler(0, 0.6, 0);

      const base = '../../helmet-follow/public/content/helmet/';
      const ktx2 = new KTX2Loader().setTranscoderPath('../../helmet-follow/node_modules/three/examples/jsm/libs/basis/').detectSupport(renderer);
      const gltf = await new GLTFLoader().setKTX2Loader(ktx2).setMeshoptDecoder(MeshoptDecoder).loadAsync(base + 'helmet.glb');
      const livery = await ktx2.loadAsync(base + 'livery.ktx2');

      const parts = {};
      gltf.scene.traverse((o) => { if (o.isMesh) parts[o.name] = o; });
      parts.Shell.material = new THREE.MeshPhysicalMaterial({
        map: livery, color: new THREE.Color(1.14, 1.2, 1.3), roughness: 0.34, metalness: 0.62, clearcoat: 1, clearcoatRoughness: 0.035,
      });
      parts.Visor.material = new THREE.MeshPhysicalMaterial({
        color: new THREE.Color(0.05, 0.07, 0.14), metalness: 0.95, roughness: 0.04, clearcoat: 1, envMapIntensity: 1.6,
        iridescence: 0.35, iridescenceIOR: 1.5, iridescenceThicknessMinimum: 280, iridescenceThicknessMaximum: 380,
      });
      parts.Trim.material = new THREE.MeshStandardMaterial({ color: new THREE.Color(0.9, 0.92, 0.95), metalness: 1, roughness: 0.12 });

      const rest = new THREE.Group();
      rest.add(gltf.scene);
      rest.rotation.set(THREE.MathUtils.degToRad(8), THREE.MathUtils.degToRad(-16), 0);
      scene.add(rest);

      const key = new THREE.DirectionalLight(0xdfe8ff, 1.4);
      key.position.set(-3, 4, 5);
      scene.add(key);

      const box = new THREE.Box3().setFromObject(rest);
      const centre = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      const r = Math.max(size.x, size.y) / 2;
      rest.position.sub(centre);
      const camera = new THREE.PerspectiveCamera(22, 1, 0.1, 100);
      camera.position.set(0, 0.15, (r * 1.22) / Math.tan(THREE.MathUtils.degToRad(11)));
      camera.lookAt(0, 0, 0);
      renderer.render(scene, camera);
      window.__done = true;
    </script>
  </body>
</html>
